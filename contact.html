<img src="Banner.jpg" alt="Military Document Management Banner" class="banner">

<div class="container">
    <h1>website Survey</h1>h1>
    <p>please complete the survey below.</p>
    <Form onsubmit="submitSurvey(event)">
        <label for="name">Name</label><br>
        <input type="text" id="name" required><br><br>

        <label for="email">Email</label><br>
        <input type="email" id="email" required><br><br>

        <label for="rating">How would you rate this website?</label><br>

        <select id="rating">
            <option>Excellent</option>
            <option>Good</option>
            <option>Average</option>
            <option>Poor</option>
        </select>

        <br><br>
        <label for="comments">Comments</label><br>
        <textarea id="comments" rows="5" cols="50"></textarea>
        <br><br>
        <input type="submit" value="Submit Survey">
        
    </form>
    <p id="message"></p>
    
</div>
<script src="script.js"></script>

</body>
</html>
